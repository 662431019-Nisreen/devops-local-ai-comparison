<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .task-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .task-form select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .task-form button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .task-form button:hover {
            background-color: #45a049;
        }
        .task-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .task-list li {
            padding: 10px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .task-list li:hover {
            background-color: #45a049;
        }
        .task-list li.completed {
            text-decoration: line-through;
        }
        .filter-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .filter-buttons button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-buttons button:hover {
            background-color: #45a049;
        }
        .total-count {
            margin-top: 20px;
            font-size: 24px;
            color: #fff;
        }
        .active-count {
            margin-top: 10px;
            font-size: 24px;
            color: #fff;
        }
        .completed-count {
            margin-top: 10px;
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Task Planner</h1>
        <form class="task-form">
            <input type="text" id="task-title" placeholder="Enter task title" required>
            <select id="task-priority" placeholder="Select priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit">Add Task</button>
        </
